apply plugin: 'maven-publish'
apply plugin: 'signing'

// Maven Central requires these metadata
ext {
    pomUrl = 'https://github.com/wkaylves/test-infra'
    pomDescription = 'A comprehensive test infrastructure platform for Java/Spring applications'
    pomLicenseName = 'The Apache License, Version 2.0'
    pomLicenseUrl = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
    pomDeveloperId = 'wkaylves'
    pomDeveloperName = 'wkaylves'
    pomDeveloperEmail = 'wkaylves@users.noreply.github.com'
    pomScmUrl = 'https://github.com/wkaylves/test-infra'
    pomScmConnection = 'scm:git:git://github.com/wkaylves/test-infra.git'
    pomScmDeveloperConnection = 'scm:git:ssh://github.com/wkaylves/test-infra.git'
}

java {
    withJavadocJar()
    withSourcesJar()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java

            groupId = project.group
            artifactId = project.name
            version = project.version

            pom {
                name = project.name
                description = pomDescription
                url = pomUrl
                inceptionYear = '2024'

                licenses {
                    license {
                        name = pomLicenseName
                        url = pomLicenseUrl
                    }
                }

                developers {
                    developer {
                        id = pomDeveloperId
                        name = pomDeveloperName
                        email = pomDeveloperEmail
                    }
                }

                scm {
                    url = pomScmUrl
                    connection = pomScmConnection
                    developerConnection = pomScmDeveloperConnection
                }
            }
        }
    }

    repositories {
        maven {
            name = "CentralPortal"
            url = version.endsWith('SNAPSHOT')
                    ? 'https://central.sonatype.com/repository/maven-snapshots/'
                    : 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'

            credentials {
                username = findProperty("centralPortalUsername")
                        ?: findProperty("ossrhUsername")
                        ?: System.getenv("CENTRAL_PORTAL_USERNAME")
                        ?: System.getenv("OSSRH_USERNAME")
                        ?: ""
                password = findProperty("centralPortalPassword")
                        ?: findProperty("ossrhPassword")
                        ?: System.getenv("CENTRAL_PORTAL_PASSWORD")
                        ?: System.getenv("OSSRH_PASSWORD")
                        ?: ""
            }
        }

        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/wkaylves/test-infra")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("USERNAME") ?: ""
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN") ?: ""
            }
        }
    }
}

signing {
    def normalizeSigningKey = { key ->
        if (!key) {
            return key
        }

        def trimmedKey = key.trim()
        if (trimmedKey.contains('BEGIN PGP PRIVATE KEY BLOCK')) {
            return key
        }

        try {
            def decodedKey = new String(trimmedKey.decodeBase64(), 'UTF-8')
            if (decodedKey.contains('BEGIN PGP PRIVATE KEY BLOCK')) {
                return decodedKey
            }
        } catch (ignored) {
            // Keep the original value so Gradle can report the real signing error.
        }

        return key
    }

    def signingKey = normalizeSigningKey(findProperty("signing.key") ?: System.getenv("GPG_SIGNING_KEY"))
    def signingPassword = findProperty("signing.password") ?: System.getenv("GPG_SIGNING_PASSWORD")

    if (signingKey) {
        useInMemoryPgpKeys(signingKey, signingPassword)
    }

    sign publishing.publications.maven
}

// Task to publish to Maven Central through the Central Portal compatibility API
tasks.register('publishToMavenCentral') {
    group = 'publishing'
    description = 'Publishes all artifacts to Maven Central via Central Portal'
    dependsOn tasks.named('publishMavenPublicationToCentralPortalRepository')
}

// Task to publish SNAPSHOT to Maven Central
tasks.register('publishSnapshotToMavenCentral') {
    group = 'publishing'
    description = 'Publishes SNAPSHOT artifacts to Maven Central snapshots'
    dependsOn tasks.named('publishMavenPublicationToCentralPortalRepository')
}

// Task to release to Maven Central (after staging)
tasks.register('releaseToMavenCentral') {
    group = 'publishing'
    description = 'Releases staged artifacts to Maven Central'
    doLast {
        println "To review deployments, visit: https://central.sonatype.com/publishing/deployments"
        println "Or use the Nexus Staging plugin compatibility tasks for automated release."
    }
}
