plugins {
    id 'java-library'
    id 'groovy'
    id 'maven-publish'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'

    //asciidoc plugins
    id 'org.asciidoctor.jvm.convert' version '3.3.2'
    id 'org.asciidoctor.jvm.pdf' version '3.3.2'
}

// ---- Asciidoctor documentation build ----
ext {
    springAsciidoctorVersion = '0.0.5'
    pdfBuildPath = "$buildDir/asciidoc/pdf"
    htmlBuildPath = "$buildDir/asciidoc/html"
}

apply plugin: "distribution"

configurations {
    asciidoctorExtensions
}

dependencies {
    asciidoctorExtensions "io.spring.asciidoctor.backends:spring-asciidoctor-backends:${springAsciidoctorVersion}"
}

asciidoctor {
    sourceDir = file("docs/asciidoc")
    baseDirFollowsSourceDir()
    sources {
        include '**/index.adoc'
    }
    resources {
        from(sourceDir) {
            include 'images/**'
        }
    }
    outputDir file("${htmlBuildPath}")
    configurations "asciidoctorExtensions"
    outputOptions {
        backends "spring-html"
    }
}

asciidoctor.doLast {
    delete file("${htmlBuildPath}/img/banner-logo.svg")
    copy {
        from file("${htmlBuildPath}/images/banner-logo.svg")
        into file("${htmlBuildPath}/img")
    }
    // GitHub Pages: prevent Jekyll processing
    file("${htmlBuildPath}/.nojekyll").text = ""
}

asciidoctorj {
    options header_footer: true
    attributes 'icons@': 'font'
}

asciidoctorPdf {
    sourceDir = file("docs/asciidoc/zh")
    baseDirFollowsSourceDir()
    sources {
        include 'index.adoc'
    }
    resources {
        from(file("docs/asciidoc")) {
            include 'images/**'
        }
    }
    outputDir file("${pdfBuildPath}")
    doLast {
        delete file("${pdfBuildPath}/${project.name}.pdf")
        copy {
            from "$pdfBuildPath"
            into "$pdfBuildPath"
            rename { String fileName -> fileName.replace('index.pdf', project.name + ".pdf") }
        }
        delete file("$pdfBuildPath/index.pdf")
    }
}

task asciidocIndex(type: Tar) {
    description '打包 html 及 pdf'
    dependsOn asciidoctor
}

// ---- End Asciidoctor ----

allprojects {
    group = 'io.github.wkaylves'
    version = '1.0.0'

    repositories {
        mavenLocal()
        maven { url 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
        maven { url 'https://repo.spring.io/milestone' }
    }
}

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl = uri("https://ossrh-staging-api.central.sonatype.com/service/local/")
            snapshotRepositoryUrl = uri("https://central.sonatype.com/repository/maven-snapshots/")
            username = findProperty("centralPortalUsername")
                    ?: findProperty("ossrhUsername")
                    ?: System.getenv("CENTRAL_PORTAL_USERNAME")
                    ?: System.getenv("OSSRH_USERNAME")
                    ?: ""
            password = findProperty("centralPortalPassword")
                    ?: findProperty("ossrhPassword")
                    ?: System.getenv("CENTRAL_PORTAL_PASSWORD")
                    ?: System.getenv("OSSRH_PASSWORD")
                    ?: ""
        }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'groovy'
    apply from: "${rootDir}/gradle/publish-mavencentral.gradle"

    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8

    ext {
        springBootVersion = '2.7.18'
        junitJupiterVersion = '5.9.3'
        mockitoVersion = '4.11.0'
        assertjVersion = '3.24.2'
        spockVersion = '2.3-groovy-4.0'
        groovyVersion = '4.0.15'
        testcontainersVersion = '1.19.3'
        mybatisSpringBootVersion = '2.3.2'
        rocketmqSpringBootVersion = '2.2.3'
        wiremockVersion = '2.35.1'
        jacksonVersion = '2.15.3'
        lombokVersion = '1.18.30'
    }

    dependencies {
        testImplementation "org.junit.jupiter:junit-jupiter:${junitJupiterVersion}"
        testImplementation "org.assertj:assertj-core:${assertjVersion}"
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.9.3'
    }

    tasks.withType(Test) {
        useJUnitPlatform()
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Javadoc) {
        options {
            encoding = "UTF-8"
            charSet = "UTF-8"
            addStringOption('Xdoclint:none', '-quiet')
        }
        failOnError = false
    }
}
