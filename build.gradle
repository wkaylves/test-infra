plugins {
    id 'java-library'
    id 'groovy'
    id 'maven-publish'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

allprojects {
    group = 'io.github.wkaylves'
    version = '1.0.0-SNAPSHOT'

    repositories {
        mavenLocal()
        maven { url 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
        maven { url 'https://repo.spring.io/milestone' }
    }
}

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl = uri("https://ossrh-staging-api.central.sonatype.com/service/local/")
            snapshotRepositoryUrl = uri("https://central.sonatype.com/repository/maven-snapshots/")
            username = findProperty("centralPortalUsername")
                    ?: findProperty("ossrhUsername")
                    ?: System.getenv("CENTRAL_PORTAL_USERNAME")
                    ?: System.getenv("OSSRH_USERNAME")
                    ?: ""
            password = findProperty("centralPortalPassword")
                    ?: findProperty("ossrhPassword")
                    ?: System.getenv("CENTRAL_PORTAL_PASSWORD")
                    ?: System.getenv("OSSRH_PASSWORD")
                    ?: ""
        }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'groovy'
    apply from: "${rootDir}/gradle/publish-mavencentral.gradle"

    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8

    ext {
        springBootVersion = '2.7.18'
        junitJupiterVersion = '5.9.3'
        mockitoVersion = '4.11.0'
        assertjVersion = '3.24.2'
        spockVersion = '2.3-groovy-4.0'
        groovyVersion = '4.0.15'
        testcontainersVersion = '1.19.3'
        mybatisSpringBootVersion = '2.3.2'
        rocketmqSpringBootVersion = '2.2.3'
        wiremockVersion = '2.35.1'
        jacksonVersion = '2.15.3'
        lombokVersion = '1.18.30'
    }

    dependencies {
        testImplementation "org.junit.jupiter:junit-jupiter:${junitJupiterVersion}"
        testImplementation "org.assertj:assertj-core:${assertjVersion}"
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.9.3'
    }

    tasks.withType(Test) {
        useJUnitPlatform()
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    // 如果是 Groovy DSL (build.gradle)
    tasks.withType(Javadoc) {
        options {
            // 允许缺失注释，不将其视为警告或错误
            encoding = "UTF-8"
            charSet = "UTF-8"
            // 关闭 doclint 的 missing 检查（或者直接传入 'none' 关闭全部检查）
            addStringOption('Xdoclint:none', '-quiet')
        }
        // 如果这些警告导致了构建失败，强制让任务在有警告时也能成功
        failOnError = false
    }
}
